[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-insight"
version = "0.2.0"
description = "原神抽卡本地清洗、聚合稽核与可视化工程"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["pandas>=2.2,<4"]
viz = ["matplotlib>=3.8,<4", "numpy>=1.26,<3"]
presentation = ["fonttools>=4.50,<5"]
motion = ["imageio-ffmpeg>=0.6,<1", "numpy>=1.26,<3", "fonttools>=4.50,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
genshin-insight = "genshin_insight.__main__:main"

[tool.setuptools]
packages = ["genshin_insight", "genshin_insight.viz", "theme"]

[tool.setuptools.package-dir]
genshin_insight = "src/genshin_insight"
theme = "theme"

[tool.setuptools.package-data]
"genshin_insight.viz" = ["*.html", "*.txt", "*.cjs"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
