<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原神数据分析 · 动画母版</title>
<style>
@font-face{font-family:Opener;src:url(data:font/woff;base64,__FONT__) format('woff');font-weight:100 900;font-display:block}
*{box-sizing:border-box}html,body{margin:0;background:#030611;color:#fff;font-family:Opener,sans-serif;height:100%;overflow:hidden}
main{height:100%;display:grid;place-items:center}.stage{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9}video,canvas{position:absolute;inset:0;width:100%;height:100%;display:block}video{object-fit:contain}
#controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:10px 18px;background:#070d20e8;border-radius:8px;opacity:0;transition:opacity .2s}
body:hover #controls,body:focus-within #controls{opacity:1}button{font:inherit;color:#fff;background:none;border:1px solid #71809b;padding:6px 14px;cursor:pointer}input{width:240px;accent-color:#e6c68c}span{font-size:14px;font-variant-numeric:tabular-nums}
</style>
<main><div class="stage"><video id="background" src="assets/background.mp4" preload="auto" playsinline></video><canvas id="film" width="1920" height="1080" aria-label="40秒原神数据分析图表及入门白场"></canvas></div></main>
<div id="controls"><button id="play">播放</button><input id="seek" type="range" min="0" max="41.2" step="0.01" value="0" aria-label="播放位置"><span id="time"></span><button id="full">全屏</button></div>
<script id="font-license" type="text/plain">__FONT_LICENSE__</script>
<script>
const DATA=__DATA__,SCENES=__SCENES__,TIMING=__TIMING__,FOOTER='__FOOTER__';
const canvas=document.getElementById('film'),ctx=canvas.getContext('2d',{alpha:true}),background=document.getElementById('background');
const C={white:'#f7f5ef',gold:'#e6c68c',cyan:'#91c9e5',muted:'#b0bbce',axis:'#5d708d',faint:'#8996ad',gray:'#7e8a9e',navy:'#050917'};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**3,fmt=x=>Math.round(x).toLocaleString('en-US');
const frames={text:[],errors:[]};let lastTime=0,playing=false,raf=0;

function text(value,x,y,size=40,color=C.white,options={}){
  ctx.save();ctx.font=`${options.weight||400} ${size}px Opener`;ctx.textAlign=options.align||'left';ctx.textBaseline='alphabetic';ctx.fillStyle=color;
  if(options.tracking)ctx.letterSpacing=options.tracking+'px';
  if(options.glow){ctx.shadowColor=color;ctx.shadowBlur=options.glow;}
  const m=ctx.measureText(String(value)),left=x-(ctx.textAlign==='center'?m.width/2:ctx.textAlign==='right'?m.width:0);
  const box={value:String(value),left,top:y-m.actualBoundingBoxAscent,right:left+m.width,bottom:y+m.actualBoundingBoxDescent};frames.text.push(box);
  if(box.left<110||box.right>1810||box.top<65||box.bottom>1050)frames.errors.push(box);
  ctx.fillText(value,x,y);ctx.restore();return box;
}
function line(points,color,width=3){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function number(value,progress,x,y,size,color=C.gold,decimals=0){const n=value*ease(progress);text(decimals?n.toFixed(decimals):fmt(n),x,y,size,color,{weight:700,glow:16});}
function heading(title,subtitle){text(title,144,211,54,C.white,{weight:700});if(subtitle)text(subtitle,145,268,28,C.muted);}
function footer(note='仅描述样本留存记录'){text(FOOTER,144,1034,22,C.faint);text(note,1776,1034,22,C.faint,{align:'right'});}
function hbars(rows,progress,{x=1030,y=400,width=690,rowHeight=110,max=20000,color=C.gold,labelsX=765,format=fmt,alignRows=false}={}){
  rows.forEach((row,i)=>{
    const p=ease(progress-i*.11),colorHere=i===0?color:C.gray,yy=y+i*rowHeight;
    const label=text(row.name,labelsX,yy,31,i===0?C.white:C.muted,{weight:i===0?700:400});
    const value=text(format(row.count),1776,yy,31,i===0?color:C.muted,{align:'right',weight:i===0?700:400});
    const barTop=alignRows?(Math.min(label.top,value.top)+Math.max(label.bottom,value.bottom)-27)/2:yy+24;
    ctx.fillStyle=colorHere;ctx.shadowColor=colorHere;ctx.shadowBlur=i===0?14:0;ctx.fillRect(x,barTop,width*row.count/max*p,27);ctx.shadowBlur=0;
  });
  const yy=y+(rows.length-1)*rowHeight+75;
  line([[x,yy],[x+width,yy]],C.axis,1.5);
  for(let i=0;i<=4;i++){const xx=x+width*i/4;text(format(max*i/4),xx,yy+39,23,C.faint,{align:i===0?'left':i===4?'right':'center'});}
}
function intro(u){
  ctx.save();const zoom=1.035-.035*ease(u/.8);ctx.translate(960,540);ctx.scale(zoom,zoom);ctx.translate(-960,-540);
  text('GENSHIN DATA ANALYSIS',960,324,25,C.gold,{align:'center',tracking:8});
  text('原神',960,537,174,C.white,{weight:700,align:'center',glow:25});
  text('抽卡记录可视化分析',960,650,64,C.white,{weight:500,align:'center'});
  text(`${(DATA.pulls/10000).toFixed(1)}万条留存记录`,960,757,32,C.gold,{align:'center'});ctx.restore();
}
function scale(u){
  heading('主分析数据规模','2020年12月至2022年7月');
  number(DATA.pulls,u/1.8,144,534,205);
  text('条留存抽卡记录',150,615,44,C.white);
  number(DATA.people,(u-.4)/1.6,148,797,88,C.cyan);text('个账号',505,794,40,C.muted);
  text(`${DATA.first.replaceAll('-','.')}  至  ${DATA.last.replaceAll('-','.')}`,1776,796,36,C.muted,{align:'right'});
  footer('主分析03，同一来源内账号去重');
}
function pools(u){
  heading(`角色活动祈愿贡献${DATA.roleShare.toFixed(1)}%的记录`,'各卡池留存抽数，按记录量排序');
  number(DATA.roleShare,u/1.4,144,541,156,C.gold,1);text('%',555,538,70,C.gold);
  text('角色活动祈愿',150,634,45,C.white);text('占全部留存抽数',150,696,30,C.muted);
  hbars(DATA.pools,u/.95,{x:745,y:377,width:1030,rowHeight:127,max:12000000,labelsX:745,format:n=>(n/10000).toFixed(n?1:0)+'万'});
  text('抽数，零起点',1776,964,25,C.muted,{align:'right'});footer();
}
function months(u){
  const peak=DATA.peak,month=peak.month.split('-'),points=DATA.months;
  heading(`${month[0]}年${Number(month[1])}月出现角色池月度峰值`,'按自然月累计的角色活动祈愿留存抽数');
  number(peak.count/10000,u/1.2,144,541,157,C.gold,1);text('万抽',150,631,57,C.gold);text('单池单月记录',150,697,31,C.muted);
  const x=825,y=350,w=935,h=486,max=Math.ceil(peak.count/500000)*500000;
  for(let j=0;j<=4;j++){const yy=y+h-h*j/4;line([[x,yy],[x+w,yy]],j? '#28364b':C.axis,1);text((max*j/4/10000).toFixed(0),x-25,yy+9,26,C.faint,{align:'right'});}
  text('万抽',x,316,25,C.muted);
  const visible=(points.length-1)*ease((u-.2)/2.4),xy=(p,i)=>[x+w*i/(points.length-1),y+h-h*p.count/max];
  ctx.save();ctx.beginPath();ctx.rect(x-10,y-10,w*Math.min(1,(visible+0.1)/(points.length-1))+20,h+30);ctx.clip();
  let path=[];const flush=()=>{if(path.length>1){ctx.beginPath();ctx.moveTo(path[0][0],y+h);path.forEach(p=>ctx.lineTo(...p));ctx.lineTo(path.at(-1)[0],y+h);ctx.fillStyle='#e6c68c17';ctx.fill();ctx.shadowColor=C.gold;ctx.shadowBlur=16;line(path,C.gold,5);ctx.shadowBlur=0;}path=[];};
  points.forEach((p,i)=>{if(p.count===null){flush();return;}path.push(xy(p,i));});flush();ctx.restore();
  [0,Math.floor((points.length-1)/3),points.findIndex(p=>p.month===peak.month),points.length-1].forEach(i=>{text(points[i].month.replace('-','.'),x+w*i/(points.length-1),895,26,C.faint,{align:i===0?'left':i===points.length-1?'right':'center'});});
  const index=points.findIndex(p=>p.month===peak.month);
  if(visible>=index){const [px,py]=xy(peak,index);ctx.beginPath();ctx.arc(px,py,8,0,2*Math.PI);ctx.fillStyle=C.gold;ctx.shadowColor=C.gold;ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;text(peak.month.replace('-','.'),px,py-27,29,C.gold,{align:'center',weight:700});}
  footer('时区未知，起止月可能不完整');
}
function volume(u){
  heading(`账号留存抽数的中位数为${fmt(DATA.median)}抽`,'同一账号合并各卡池记录后统计');
  number(DATA.median,u/1.2,144,548,202);text('抽',560,545,78,C.gold);
  text('账号留存抽数',150,642,40,C.white);text('中位数',150,704,35,C.muted);
  const rows=DATA.bins.map(row=>({name:row.hi===null?`${fmt(row.lo)}及以上`:`${fmt(row.lo)}–${fmt(row.hi)}`,count:row.count}));
  const max=Math.ceil(Math.max(...rows.map(row=>row.count))/2000)*2000;
  const peakIndex=rows.findIndex(row=>row.count===Math.max(...rows.map(item=>item.count)));
  rows.forEach((row,i)=>{const yy=354+i*75;const emph=i===peakIndex;text(row.name,825,yy+6,26,emph?C.white:C.muted);text(fmt(row.count),1776,yy+6,27,emph?C.gold:C.muted,{align:'right'});ctx.fillStyle=emph?C.gold:C.gray;ctx.fillRect(1080,yy-19,590*row.count/max*ease(u/.9-i*.08),30);});
  line([[1080,891],[1670,891]],C.axis,1.5);for(let i=0;i<=4;i++)text(fmt(max*i/4),1080+590*i/4,932,24,C.faint,{align:'center'});
  text('账号数，零起点',1776,978,25,C.muted,{align:'right'});footer('记录量不等于完整历史或付费水平');
}
function names(u){
  const top=DATA.items[0];heading(`五星原始名称中，${top.name}记录最多`,'按精确原始名称统计，未合并翻译别名');
  text(top.name,144,486,101,C.white,{weight:700});number(top.count,u/1.2,144,650,116);text('次',620,648,53,C.gold);
  text('留存记录出现次数',150,732,31,C.muted);
  hbars(DATA.items,u/1.1,{x:1075,y:369,width:600,rowHeight:105,max:Math.ceil(top.count/5000)*5000,labelsX:825,alignRows:true});
  text('次数，零起点',1776,974,25,C.muted,{align:'right'});footer('原始名称榜，仅描述样本记录');
}
function ending(u){
  text('GENSHIN DATA ANALYSIS',144,330,27,C.gold,{tracking:7});
  text('原神抽卡记录',144,502,106,C.white,{weight:700,glow:15});
  text('清洗与可视化分析',144,643,100,C.white,{weight:700});
  text('项目答辩',150,783,40,C.gold);text('以下进入完整汇报',150,847,28,C.muted);
}
const sceneDraw=[intro,scale,pools,months,volume,names,ending];
function renderFrame(t){
  t=Math.min(TIMING.duration,Math.max(0,t));lastTime=t;frames.text=[];frames.errors=[];
  ctx.globalAlpha=1;ctx.clearRect(0,0,1920,1080);
  const i=SCENES.findIndex(([start,end])=>t>=start&&t<end),scene=SCENES[i];
  const visibility=1-clamp((t-TIMING.fadeStart)/(TIMING.graphicsDuration-TIMING.fadeStart));
  if(scene&&visibility>0){
    // Static contrast only. The supplied video supplies all background motion.
    ctx.globalAlpha=.42*visibility;ctx.fillStyle='#030611';ctx.fillRect(0,0,1920,1080);
    const u=t-scene[0],tail=i===6?1:clamp((scene[1]-t)/.42);ctx.globalAlpha=ease(u/.55)*tail*visibility;
    ctx.save();ctx.translate(0,24*(1-ease(u/.65)));sceneDraw[i](u);ctx.restore();
  }
  ctx.globalAlpha=1;
  document.getElementById('seek').value=t;document.getElementById('time').textContent=`${t.toFixed(1)} / ${TIMING.duration.toFixed(1)} 秒`;
  return {scene:scene?i:7,title:scene?scene[2]:'入门白场',errors:frames.errors,text:frames.text,foregroundVisible:visibility>0};
}
window.renderFrame=renderFrame;window.filmData=DATA;window.filmScenes=SCENES;window.filmTiming=TIMING;window.filmReady=false;
async function seekFilm(t){
  const position=Math.min(TIMING.duration-.001,Math.max(0,t));
  if(Math.abs(background.currentTime-position)>.0001){await new Promise((resolve,reject)=>{background.addEventListener('seeked',resolve,{once:true});background.addEventListener('error',reject,{once:true});background.currentTime=position;});}
  return renderFrame(t);
}
window.seekFilm=seekFilm;
function pause(){playing=false;background.pause();cancelAnimationFrame(raf);document.getElementById('play').textContent='播放';}
function tick(){if(!playing)return;renderFrame(background.currentTime);raf=requestAnimationFrame(tick);}
background.onended=()=>{renderFrame(TIMING.duration);pause();};
document.getElementById('play').onclick=async()=>{if(playing)pause();else{if(lastTime>=TIMING.duration-.1)await seekFilm(0);await background.play();playing=true;document.getElementById('play').textContent='暂停';tick();}};
document.getElementById('seek').max=TIMING.duration;
document.getElementById('seek').oninput=event=>{pause();seekFilm(Number(event.target.value));};
document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
const videoReady=background.readyState>=2?Promise.resolve():new Promise((resolve,reject)=>{background.addEventListener('loadeddata',resolve,{once:true});background.addEventListener('error',reject,{once:true});});
Promise.all([videoReady,document.fonts.load('700 40px Opener'),document.fonts.ready]).then(async()=>{await seekFilm(2.6);window.filmReady=true;}).catch(error=>{document.body.dataset.error=String(error);throw error;});
</script>
</html>
