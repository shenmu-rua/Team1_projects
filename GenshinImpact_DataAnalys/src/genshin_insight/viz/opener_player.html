<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原神数据分析 · 答辩入口</title>
<style>
@font-face{font-family:Opener;src:url(data:font/woff;base64,__FONT__) format('woff');font-weight:100 900}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#030611;color:#f7f5ef;font-family:Opener,sans-serif;overflow:hidden}
#screen{height:100%;width:100%;position:relative;background:#030611}video{width:100%;height:100%;object-fit:contain}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f6f8fc;display:none}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#030611a8}
h1{font-size:clamp(28px,4vw,64px);font-weight:700;margin:0}p{font-size:clamp(14px,1.7vw,22px);color:#b0bbce;margin:0}
button{font:inherit;cursor:pointer}#start{background:#e6c68c;color:#101523;border:0;padding:15px 38px;font-size:22px;margin-top:18px}#skip{position:absolute;right:28px;top:24px;background:#070e20b8;color:#f7f5ef;border:1px solid #5d708d;padding:9px 16px;font-size:16px}
body.in-deck iframe{display:block}body.in-deck video,body.in-deck #cover,body.in-deck #skip{display:none}
</style>
<div id="screen">
<video id="video" src="开场视频.mp4" poster="poster.jpg" preload="auto" playsinline></video>
<iframe id="deck" src="../defense_20261019_final/index.html#slide-1" title="32页完整答辩" allowfullscreen></iframe>
<div id="cover"><h1>原神抽卡记录清洗与可视化分析</h1><p>40秒开场短片，片尾自动进入完整答辩</p><button id="start">播放开场</button><p id="error" role="status"></p></div>
<button id="skip">跳过片头，进入答辩</button>
</div>
<script>
const video=document.getElementById('video'),deck=document.getElementById('deck');
function enterDefense(){video.pause();document.body.classList.add('in-deck');deck.focus();}
document.getElementById('start').onclick=async()=>{try{await video.play();document.getElementById('cover').style.display='none';try{await document.documentElement.requestFullscreen();}catch{}}catch{document.getElementById('error').textContent='请将开场视频与此页面放在同一目录，或使用右上角按钮进入答辩。';}};
video.onended=enterDefense;document.getElementById('skip').onclick=enterDefense;
video.onclick=()=>video.paused?video.play():video.pause();
document.addEventListener('keydown',event=>{if(!document.body.classList.contains('in-deck')&&event.code==='Space'){event.preventDefault();video.paused?video.play():video.pause();}});
window.enterDefense=enterDefense;
</script>
</html>
